<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · The Bohemians Festival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #0d0a07;
      --bg-card:    #161009;
      --orange:     #e8500a;
      --gold:       #c9a84c;
      --text:       #f5f0e8;
      --text-muted: #8a7a6a;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid rgba(232,80,10,0.15);
      border-radius: 4px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 36px;
    }
    .login-error {
      background: rgba(232,80,10,0.12);
      border: 1px solid rgba(232,80,10,0.4);
      color: var(--orange);
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 2px;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 2px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--orange);
    }
    .btn-login {
      width: 100%;
      margin-top: 24px;
      background: var(--orange);
      color: #fff;
      border: none;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.85; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="login-card">
    <p class="login-logo">The Bohemians</p>
    <p class="login-label">Admin Panel</p>

    <div id="errorMsg" class="login-error" style="display:none;">
      Date incorecte. Încearcă din nou.
    </div>

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label for="username">Utilizator</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus />
      </div>
      <div class="form-group">
        <label for="password">Parolă</label>
        <input type="password" id="password" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-login">Intră</button>
    </form>

    <a href="/" class="back-link">← Înapoi la site</a>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
